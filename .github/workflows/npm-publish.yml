name: Publish Plus to npm
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub release tag to publish
        required: true
        default: v0.4.4-beta.7
permissions:
  contents: read
concurrency:
  group: plus-npm-publish
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'pponce/homebridge-nest-accfactory-plus' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}
          submodules: true
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Validate package and published GitHub release
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$RELEASE_TAG"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const pkg = JSON.parse(fs.readFileSync('package.json'));
          assert.equal(pkg.name, 'homebridge-nest-accfactory-plus');
          assert.equal('v' + pkg.version, process.env.RELEASE_TAG);
          const channel = pkg.version.includes('-') ? 'beta' : 'latest';
          fs.appendFileSync(process.env.GITHUB_ENV, 'NPM_TAG=' + channel + '\n');
          NODE
      - run: npm ci
      - run: npm run check
      - run: node scripts/check-package.js
      - run: npm publish --access public --tag "$NPM_TAG"
